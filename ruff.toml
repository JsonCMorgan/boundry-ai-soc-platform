# Lint gate for CI. Starts with "real bug" rules only (syntax errors, undefined names)
# so the check stays green on the large legacy app.py; tighten the selection over time.
target-version = "py311"
extend-exclude = [
    "tools/_*.py",   # one-off content patch fragments, exec'd by other scripts
]

[lint]
select = ["E9", "F63", "F7", "F82"]
