<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ drill.title }} — Net Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      background: #0a0e14; color: #cdd6e0;
    }
    .topbar {
      background: #0f1923; border-bottom: 1px solid #1e3045;
      padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { color: #34d399; font-weight: 800; }
    .topbar a { color: #7a9ab0; text-decoration: none; margin-left: 14px; font-size: 0.85em; }
    .main { max-width: 920px; margin: 0 auto; padding: 24px 18px 90px; }
    h1 { color: #fff; margin: 0 0 8px; font-size: 1.25em; }
    .teach { color: #9ab; font-size: 0.85em; line-height: 1.45; margin-bottom: 14px; }
    .panel {
      background: #0f1923; border: 1px solid #1e3045; border-radius: 8px;
      padding: 14px; margin-bottom: 14px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 0.9em; color: #34d399; }
    pre.raw {
      background: #0a0e14; border: 1px solid #1e3045; border-radius: 6px;
      padding: 12px; font-size: 0.72em; white-space: pre-wrap; color: #8aa;
      max-height: 300px; overflow: auto;
    }
    label.chk {
      display: block; font-size: 0.8em; margin: 6px 0; cursor: pointer; color: #cdd6e0;
    }
    select, button { font-family: inherit; font-size: 0.8em; }
    select {
      width: 100%; background: #0a0e14; border: 1px solid #1e3045; color: #cdd6e0;
      border-radius: 6px; padding: 8px; margin-top: 6px; margin-bottom: 10px;
    }
    .btn {
      margin-top: 12px; padding: 10px 14px; border-radius: 6px; border: 1px solid #34d39966;
      background: #34d39918; color: #34d399; font-weight: 800; cursor: pointer;
    }
    .result {
      display: none; margin-top: 14px; padding: 12px; border-radius: 8px;
      border: 1px solid #1e3045; background: #131d28; font-size: 0.82em; line-height: 1.45;
    }
    .result.show { display: block; }
  
    .btn-next { border-color: #00ff8866; background: #00ff8818; color: #00ff88; display: none; text-decoration: none; }
    .btn-next.show { display: inline-block; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Net-for-SOC Lab</span>
    <div>
      <a href="/career/net">← Lab hub</a>
      <a href="/career">Career</a>
    </div>
  </div>
  <div class="main">
    <h1>{{ drill.title }}</h1>
    <p class="teach">{{ drill.teach }}</p>

    <div class="panel">
      <h2>1. Show me — traffic snippet</h2>
      <pre class="raw">{{ drill.snippet }}</pre>
    </div>

    <div class="panel">
      <h2>2. Prove it — name the signal and direction</h2>
      <label style="display:block;font-size:0.8em;color:#9ab;">Primary network signal</label>
      <select id="signal">
        <option value="">Select…</option>
        {% for s in signals %}
        <option value="{{ s.id }}">{{ s.label }}</option>
        {% endfor %}
      </select>
      <label style="display:block;font-size:0.8em;color:#9ab;">Traffic direction</label>
      <select id="direction">
        <option value="">Select…</option>
        {% for d in directions %}
        <option value="{{ d.id }}">{{ d.label }}</option>
        {% endfor %}
      </select>
      {% for c in checklist %}
      <label class="chk"><input type="checkbox" id="c-{{ c.id }}"> {{ c.label }}</label>
      {% endfor %}
      <button type="button" class="btn" onclick="grade()">Submit drill</button>
      <div class="result" id="result"></div>
      <a class="btn btn-next" id="next-scenario" href="{{ next_preview.url if next_preview else '#' }}">Next scenario →</a>

    </div>
  </div>
  <script>
  var CSRF = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';

  function showNext(d) {
    var nb = document.getElementById('next-scenario');
    if (!nb) return;
    if (d && d.next && d.next.url) nb.href = d.next.url;
    nb.classList.add('show');
  }
  var DRILL_ID = {{ drill.id | tojson }};

  function grade() {
    var signal = document.getElementById('signal').value;
    var direction = document.getElementById('direction').value;
    if (!signal || !direction) { alert('Pick network signal and traffic direction'); return; }
    var checklist = {};
    {{ checklist | map(attribute='id') | list | tojson }}.forEach(function (id) {
      checklist[id] = !!(document.getElementById('c-' + id) || {}).checked;
    });
    fetch('/api/career/net/grade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify({
        drill_id: DRILL_ID,
        signal_id: signal,
        direction_id: direction,
        checklist: checklist
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      BoundryRationale.renderResult(document.getElementById('result'), d);
      if (d && d.ok) showNext(d);
    });
  }
  </script>
  {% include '_career_rationale.html' %}
  {% include '_career_tutor.html' %}
</body>
</html>
