<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ scenario.title }} — Tune or Tolerate</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Cascadia Code","Fira Code",Consolas,monospace; background:#0a0e14; color:#cdd6e0; }
    .topbar { background:#0f1923; border-bottom:1px solid #1e3045; padding:14px 28px; display:flex; justify-content:space-between; }
    .brand { color:#ffcc00; font-weight:800; }
    .topbar a { color:#7a9ab0; text-decoration:none; margin-left:14px; font-size:0.85em; }
    .main { max-width:820px; margin:0 auto; padding:28px 20px 80px; }
    h1 { color:#fff; font-size:1.2em; }
    .card { background:#0f1923; border:1px solid #1e3045; border-radius:8px; padding:14px; margin:12px 0; font-size:0.85em; line-height:1.5; }
    label.opt { display:block; margin:10px 0; cursor:pointer; padding:8px; border:1px solid #1e3045; border-radius:6px; }
    label.opt:hover { border-color:#ffcc0066; }
    .btn { margin-top:12px; padding:9px 14px; border-radius:6px; border:1px solid #ffcc0066; background:#ffcc0022; color:#ffcc00; font-weight:700; cursor:pointer; font-family:inherit; }
    .result { display:none; margin-top:16px; background:#131d28; border:1px solid #1e3045; border-radius:8px; padding:14px; }
    .result.show { display:block; }
    .ok { color:#00ff88; } .bad { color:#ff8c00; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Tune or Tolerate · G17</span>
    <div><a href="/career/tune">← Drills</a><a href="/career">Career</a></div>
  </div>
  <div class="main">
    <div style="font-size:0.75em;color:#ffcc00;">{{ scenario.difficulty }}</div>
    <h1>{{ scenario.title }}</h1>
    <div class="card">{{ scenario.story }}</div>
    <div class="card">
      {% for o in scenario.options %}
      <label class="opt"><input type="radio" name="choice" value="{{ o.id }}"> {{ o.label }}</label>
      {% endfor %}
    </div>
    <button type="button" class="btn" onclick="grade()">Grade</button>
    <div class="result" id="result"></div>
  </div>
  <script>
  var CSRF = (document.querySelector('meta[name="csrf-token"]')||{}).content || '';
  var SID = {{ scenario.id | tojson }};
  function grade() {
    var el = document.querySelector('input[name="choice"]:checked');
    fetch('/api/career/tune/grade', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},
      body: JSON.stringify({ drill_id: SID, choice: el ? el.value : '' })
    }).then(function(r){return r.json();}).then(function(d){
      BoundryRationale.renderResult(document.getElementById('result'), d);
    });
  }
  </script>
  {% include '_career_rationale.html' %}
</body>
</html>
