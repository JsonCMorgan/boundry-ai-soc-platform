<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boundry.AI — Account Recovery</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 20px; color: #222; }
        h1 { color: #c0392b; font-size: 1.4em; }
        label { display: block; font-size: 0.9em; font-weight: bold; margin-bottom: 4px; margin-top: 14px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 1em; box-sizing: border-box;
        }
        button { margin-top: 18px; width: 100%; padding: 12px; background: #c0392b;
                 color: white; border: none; border-radius: 4px; font-size: 1em;
                 font-weight: bold; cursor: pointer; }
        button:hover { background: #a93226; }
        .error   { background: #fdf5f5; border-left: 4px solid #c0392b; color: #c0392b;
                   padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9em; }
        .success { background: #f0faf0; border-left: 4px solid #27ae60; color: #1e8449;
                   padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9em; }
        .note { font-size: 0.8em; color: #999; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Account Recovery</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}
        <div class="success">{{ success }} <a href="/login">Go to login →</a></div>
    {% else %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required autofocus>

            <label>New Password</label>
            <input type="password" name="new_password" required minlength="12">

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="12">

            <button type="submit">Reset Password</button>
        </form>
        <p class="note">Password must be 12+ characters with uppercase, number, and special character.<br>
        Remove the RESET_TOKEN env var from Railway after use.</p>
    {% endif %}
</body>
</html>
