<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boundry.AI — Incident Report</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #222; }
        nav { margin-bottom: 30px; }
        nav a { color: #c0392b; text-decoration: none; margin-right: 16px; }
        .report-body { line-height: 1.7; }
        .report-body h1 { color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 8px; }
        .report-body h2 { color: #333; margin-top: 32px; }
        .report-body h3 { color: #555; }
        .report-body blockquote {
            border-left: 4px solid #c0392b;
            margin: 0;
            padding: 8px 16px;
            background: #fdf5f5;
            color: #555;
            font-style: italic;
        }
        .report-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .report-body th {
            background: #c0392b;
            color: white;
            padding: 8px 12px;
            text-align: left;
        }
        .report-body td { padding: 8px 12px; border-bottom: 1px solid #eee; }
        .report-body ul { padding-left: 20px; }
        .report-body li { margin-bottom: 6px; }
        .report-body code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
        .report-body hr { border: none; border-top: 1px solid #eee; margin: 32px 0; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #c0392b;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { text-decoration: underline; }
        .filename-label { font-size: 0.8em; color: #aaa; margin-bottom: 24px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/reports">All Reports</a>
        <a href="/logout">Logout</a>
    </nav>

    <a class="back-link" href="/reports">← Back to Reports</a>
    <div class="filename-label">
        Report #{{ report_id }} &mdash; Generated:
        <span class="local-time" data-utc="{{ created_at }}">{{ created_at }}</span>
        &mdash; {{ event_count }} event(s) analysed &mdash; {{ threat_count }} threat(s) detected
    </div>

    <div class="report-body">
        {{ content }}
    </div>

    <hr>
    <p style="font-size: 0.8em; color: #aaa;">Boundry.AI — Security that speaks your language.</p>

    <script>
        document.querySelectorAll('.local-time').forEach(function (el) {
            var raw = el.getAttribute('data-utc').trim().replace(' ', 'T');
            if (!raw.endsWith('Z') && !raw.includes('+') && !raw.includes('-', 10)) {
                raw += 'Z';
            }
            var d = new Date(raw);
            if (!isNaN(d)) {
                el.textContent = d.toLocaleString(undefined, {
                    year: 'numeric', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }
        });
    </script>
</body>
</html>
